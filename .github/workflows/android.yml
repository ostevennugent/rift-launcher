name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -vE "^> Task|^$" build.log | grep -E "^e: |What went wrong|Execution failed|error:|AAPT|^> |Caused by|Could not|not found|Unresolved" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        with:
          name: rift-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
